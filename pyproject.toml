[project]
name = "notamify-mcp"
version = "0.2.0"
description = "MCP server for Notamify API - Access NOTAMs (Notice to Airmen) data"
authors = [
    { name = "Damian Szumski", email = "damian@notamify.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2.0,<3",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11.5,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["notamify_server.py"]

[project.scripts]
notamify-mcp = "notamify_server:main"

[project.urls]
Homepage = "https://github.com/skymerse/notamify-mcp"
Repository = "https://github.com/skymerse/notamify-mcp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: exercises the real Notamify API and may consume API credits",
]
